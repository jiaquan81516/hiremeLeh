name: Scheduled Job Data Refresh

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  refresh-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Call backend job refresh endpoint
        run: |
          curl -X POST "${{ secrets.AZURE_API_BASE_URL }}/api/jobs/refresh" \
            -H "x-refresh-secret: ${{ secrets.REFRESH_JOBS_SECRET }}"
